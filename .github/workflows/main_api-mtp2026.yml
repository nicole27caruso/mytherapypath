# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - api-mtp2026

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Azure's OneDeploy holds a single lock per App Service -- two runs landing
# close together (e.g. two pushes within a minute) collide on it with a 409,
# even though neither run is otherwise broken. Cancelling a superseded
# in-progress run avoids that; the newer push's code is what should ship
# anyway.
concurrency:
  group: deploy-api-mtp2026
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This is a monorepo — the FastAPI app lives in apps/backend, not the repo
      # root, so both the local build and the deployment artifact need to be
      # scoped to that subfolder (the auto-generated version of this workflow
      # assumed a single-app repo and failed immediately on `pip install -r
      # requirements.txt` since that file isn't at the root).
      - name: Create and Start virtual environment and Install dependencies
        working-directory: apps/backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size.
      - name: Zip apps/backend for deployment
        run: |
          cd apps/backend
          zip -r ../../release.zip . -x "antenv/*"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip -o release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8F5F24E5FD344AFF83042E8CA24C86DE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0C60D26B396440268B619FA31D7E3EDE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8D14C1748BF04BAC9F90812ACF305804 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'api-mtp2026'
          slot-name: 'Production'
          